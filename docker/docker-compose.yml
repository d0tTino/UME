version: '3.8'

services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://localhost:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    volumes:
      - ./certs:/etc/redpanda/certs:ro
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: redpandadata/console:latest
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      REDPANDA_ADMIN_HOSTS: "redpanda:9644"
      REDPANDA_BROKERS: "redpanda:29092"
      CONFIG_FILEPATH: /tmp/config.yaml

  privacy-agent:
    build:
      context: ..
      dockerfile: Dockerfile.privacy-agent
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_sasl_password
      UME_DB_PATH: "/data/ume_graph.db"
    secrets:
      - kafka_sasl_password
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f privacy_agent.py || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD before starting compose}
    ports:
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    secrets:
      - neo4j_password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cat /run/secrets/neo4j_password)\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ume-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn ume.api:app --host 0.0.0.0 --port 8000
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      UME_ENV: ${UME_ENV:-production}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_sasl_password
      UME_DB_PATH: "/data/ume_graph.db"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      UME_API_TOKEN_FILE: /run/secrets/ume_api_token
      UME_OAUTH_PASSWORD_FILE: /run/secrets/ume_oauth_password
    ports:
      - "8000:8000"
    volumes:
      - ume-db:/data
    secrets:
      - neo4j_password
      - kafka_sasl_password
      - ume_api_token
      - ume_oauth_password
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f uvicorn || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn ume.ingestion_api:app --host 0.0.0.0 --port 8001
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      UME_ENV: ${UME_ENV:-production}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_sasl_password
    ports:
      - "8001:8001"
    secrets:
      - kafka_sasl_password
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f uvicorn || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: poetry run python -m ume.services.projection_worker
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      UME_ENV: ${UME_ENV:-production}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_sasl_password
      UME_DB_PATH: "/data/ume_graph.db"
    volumes:
      - ume-db:/data
    secrets:
      - kafka_sasl_password
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ume.services.projection_worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-smoke-check:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: poetry run python examples/compose_projection_smoke_check.py
    profiles: ["smoke"]
    depends_on:
      redpanda:
        condition: service_healthy
      graph-consumer:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      UME_DB_PATH: "/data/ume_graph.db"
    volumes:
      - ume-db:/data

  secure-config-check:
    image: alpine:3.19
    profiles: ["secure-kafka", "secure-api"]
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$UME_API_TOKEN" || (echo "UME_API_TOKEN is required" && exit 1)
        test -n "$$UME_OAUTH_PASSWORD" || (echo "UME_OAUTH_PASSWORD is required" && exit 1)
        if [ "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}" = "SASL_SSL" ] || [ "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}" = "SASL_PLAINTEXT" ]; then
          test -n "$$KAFKA_SASL_USERNAME" || (echo "KAFKA_SASL_USERNAME is required for SASL" && exit 1)
          test -n "$$KAFKA_SASL_PASSWORD" || (echo "KAFKA_SASL_PASSWORD is required for SASL" && exit 1)
        fi
        if [ "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}" = "SSL" ] || [ "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}" = "SASL_SSL" ]; then
          test -n "$$KAFKA_CA_CERT" || (echo "KAFKA_CA_CERT is required for TLS" && exit 1)
        fi
        echo "secure profile config check passed"
    environment:
      UME_API_TOKEN: ${UME_API_TOKEN:-}
      UME_OAUTH_PASSWORD: ${UME_OAUTH_PASSWORD:-}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CA_CERT: ${KAFKA_CA_CERT:-}

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../docs/grafana/ume_dashboard.json:/var/lib/grafana/dashboards/ume_dashboard.json:ro
    ports:
      - "3000:3000"

secrets:
  neo4j_password:
    file: ${NEO4J_PASSWORD_SECRET_FILE:-./secrets/neo4j_password.txt}
  kafka_sasl_password:
    file: ${KAFKA_SASL_PASSWORD_SECRET_FILE:-./secrets/kafka_sasl_password.txt}
  ume_api_token:
    file: ${UME_API_TOKEN_SECRET_FILE:-./secrets/ume_api_token.txt}
  ume_oauth_password:
    file: ${UME_OAUTH_PASSWORD_SECRET_FILE:-./secrets/ume_oauth_password.txt}

volumes:
  ume-db:
  neo4j-data:
