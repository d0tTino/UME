name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-install:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to run CI
        id: changes
        run: |
          python scripts/ci_should_run.py
          status=$?
          if [ "$status" = 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
          run: ${{ steps.changes.outputs.run }}

      - name: Enforce docker secrets guard
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/check_docker_secrets_guard.sh

      - name: Run pre-commit
        if: steps.changes.outputs.run == 'true'
        run: poetry run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Check docs architecture terminology/glossary legacy-section consistency
        if: steps.changes.outputs.run == 'true'
        run: python scripts/check_arch_terms.py

      - name: Check deprecated contract terminology legacy labeling
        if: steps.changes.outputs.run == 'true'
        run: python scripts/check_contract_terms.py

      - name: Check deprecated internal callsites
        if: steps.changes.outputs.run == 'true'
        run: poetry run python scripts/check_deprecated_callsites.py

      - name: Enforce protobuf generated file layout
        if: steps.changes.outputs.run == 'true'
        run: poetry run python scripts/check_generated_protos.py

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies and build
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

  event-contract-parity-required:
    runs-on: ubuntu-latest
    needs: lint-and-install
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Run schema compatibility and event parity checks
        run: poetry run python scripts/check_schema_compatibility.py

  architecture-tests-required:
    runs-on: ubuntu-latest
    needs: [lint-and-install, event-contract-parity-required]
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Run architecture suite
        run: poetry run pytest tests/architecture

  unit-tests-required:
    runs-on: ubuntu-latest
    needs: [lint-and-install, event-contract-parity-required]
    if: needs.lint-and-install.outputs.run == 'true'
    env:
      UME_AUDIT_SIGNING_KEY: test-key
      UME_ENCRYPTION_ENABLED: 'true'
      UME_ENCRYPTION_KEY: c2VjcmV0a2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIz
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Run frontend tests
        run: |
          npm --prefix frontend install
          npm --prefix frontend test -- --config frontend/vitest.config.js
      - name: Run unit tests with coverage report
        run: |
          poetry run pytest --cov=ume --cov-report xml -m "not integration"
          poetry run pytest tests/test_dossier_migration.py
      - name: Coverage stage 2 (fail under 70%)
        run: poetry run coverage report --fail-under=70
      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-xml
          path: coverage.xml

  changed-lines-coverage-required:
    runs-on: ubuntu-latest
    needs: [lint-and-install, unit-tests-required]
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install diff-cover
        run: poetry run python -m pip install diff-cover
      - name: Download unit coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-xml
      - name: Enforce changed-lines coverage
        run: poetry run diff-cover coverage.xml --compare-branch=origin/main --fail-under=85

  unit-tests-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [lint-and-install, unit-tests-required]
    if: needs.lint-and-install.outputs.run == 'true'
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        coverage-threshold: [80, 85]
    env:
      UME_AUDIT_SIGNING_KEY: test-key
      UME_ENCRYPTION_ENABLED: 'true'
      UME_ENCRYPTION_KEY: c2VjcmV0a2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIz
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Run optional unit suite
        run: poetry run pytest --cov=ume --cov-report term -m "not integration"
      - name: Coverage optional gate
        run: poetry run coverage report --fail-under=${{ matrix.coverage-threshold }}


  policy-outcomes-regression-required:
    runs-on: ubuntu-latest
    needs: lint-and-install
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Run policy outcomes regression suite
        run: poetry run pytest tests/test_policy_pipeline_parity.py tests/test_security_controls.py


  replay-determinism-required:
    runs-on: ubuntu-latest
    needs: lint-and-install
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Run replay regression suite
        run: poetry run pytest tests/test_replay_regression.py

  integration-tests-required:
    runs-on: ubuntu-latest
    needs: lint-and-install
    if: needs.lint-and-install.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: poetry install --with dev --extras vector --extras embedding
      - name: Run integration tests
        env:
          UME_DOCKER_TESTS: true
        run: poetry run pytest -m integration

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [architecture-tests-required, unit-tests-required, changed-lines-coverage-required, policy-outcomes-regression-required, replay-determinism-required, integration-tests-required]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cd docker
          docker compose up -d
      - name: Wait for Redpanda health
        run: |
          cd docker
          for i in {1..30}; do
            status=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep redpanda | awk '{print $2}')
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs redpanda
          exit 1
      - name: Wait for privacy-agent health
        run: |
          cd docker
          for i in {1..30}; do
            status=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep privacy-agent | awk '{print $2}')
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs privacy-agent
          exit 1
      - name: Check privacy-agent running
        run: |
          cd docker
          docker compose ps privacy-agent
      - name: Tear down
        if: always()
        run: |
          cd docker
          docker compose down -v
